name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: 'npm' }
      - run: python -m pip install -r apps/api/requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run api:lint
      - run: npm run api:test
      - run: npm run web:typecheck
      - run: npm run web:build
      - run: npm run contract:generate
      - run: git diff --exit-code -- packages/api-client/openapi.json
